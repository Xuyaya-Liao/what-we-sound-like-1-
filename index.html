<!doctype html>
<!--
  index.html: the entry point of the website, and the SOUND screen ("how we say it").
  This is the first file the browser reads. It only does three things:
    1. Load the styles (style.css) and the libraries we use (p5.js)
    2. Lay out the basic page elements (the screens, the start screen)
    3. Load our own program (src/main.js)
  This page is also the "engine": it listens, runs the models and plays the nature
  sounds. The SEMANTIC screen ("what we say") is semantic.html, opened in a second
  window on the second display; it follows this page by itself (src/shared/bus.js).
  With ?view=both, both screens are shown side by side in this one window.
  See DESIGN-two-screens.md.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What We Sound Like · sound</title>
  <link rel="stylesheet" href="./style.css">

  <!-- p5.js draws the semantic screen's image (needed here only for ?view=both).
       It is loaded from a CDN (a public library host). The version (2.3.4) is
       pinned, the same one the demo used, so an automatic library update can
       never change how the piece looks. -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
</head>
<body>
  <!-- The screens fill the window, on the bottom layer. The semantic one only
       appears with ?view=both (then the two share the window, side by side). -->
  <div id="screens">
    <div id="sound-screen" class="screen"></div>
    <div id="semantic-screen" class="screen" hidden></div>
  </div>

  <!-- Start screen, layered on top of the screens.
       "Begin" asks for microphone permission. Browsers only allow the microphone
       and sound playback after the visitor clicks something, which is why the
       piece needs this button at all.
       Begin and the file input stay disabled until the loading bar is full:
       every model has to be downloaded and started first (src/main.js). -->
  <main id="start-screen">
    <p class="eyebrow">ML FOR ARTISTS AND DESIGNERS</p>
    <h1>What We Sound Like,<br>What We Say</h1>
    <p class="subtitle">One voice, heard two ways: how it sounds, and what it says.</p>
    <button id="start-button" type="button" disabled>Begin</button>
    <label class="choose-recording">or use a recording instead of the microphone
      <input id="recording-input" type="file" accept="audio/*" disabled>
    </label>
    <div id="loading" class="loading" role="progressbar" aria-label="Loading the models"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="loading-fill" class="loading-fill"></div>
    </div>
    <p id="status" role="status">Loading…</p>
    <p class="small-link">
      <a href="./semantic.html" target="wwsl-semantic">Open the semantic screen</a> ·
      <a href="./credits.html">Library and credits</a>
    </p>
  </main>

  <!-- Our own program. type="module" makes it a "module", which means it can
       use import to pull in code from other files (see the first line of src/main.js).
       With ?replay=… (see src/shared/replay.js) a recording is played into the
       screens instead, and the engine isn't loaded at all. -->
  <script type="module">
    const replay = new URLSearchParams(location.search).has("replay");
    import(replay ? "./src/replay-main.js" : "./src/main.js");
  </script>
</body>
</html>
